# Fachada del Strangler Pattern: Nginx decide a qué backend va cada petición.
log_format strangler '$remote_addr [$time_local] "$request" $status -> upstream=$upstream_addr';

upstream django_v1 {
    server web_django:8000;          # Monolito (catálogo, licencias, ventas)
}

upstream flask_v2 {
    server notificaciones_flask:5000; # Microservicio estrangulado (notificaciones)
}

server {
    listen 80;
    access_log /var/log/nginx/access.log strangler;

    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTAS ANTIGUAS: /api/v1/... -> monolito Django (que las expone en /api/...)
    location /api/v1/ {
        proxy_pass http://django_v1/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RUTA ESTRANGULADA: notificaciones -> microservicio Flask
    location /api/v2/notificaciones {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Todo lo que aún no se migra (admin, estáticos, /api/ legado) sigue en Django
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
