services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=marketplace
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20

  web_django: # Monolito (API v1)
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      - DB_HOST=db
      - DB_NAME=marketplace
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
      - NOTIFICATIONS_SERVICE_URL=http://notificaciones_flask:5000
    depends_on:
      db:
        condition: service_healthy
      notificaciones_flask:
        condition: service_started
    # Sin 'ports': solo Nginx habla con el monolito

  notificaciones_flask: # Microservicio estrangulado (API v2)
    build: ./servicios/notificaciones
    # Sin 'ports': solo Nginx (y el monolito) hablan con él

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web_django
      - notificaciones_flask

volumes:
  postgres_data:
