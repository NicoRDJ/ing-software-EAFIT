# Registro que muestra a QUE backend se envio cada peticion (evidencia del Strangler)
log_format strangler '$remote_addr [$time_local] "$request" $status '
                     '-> upstream=$upstream_addr ($upstream_response_time s)';

upstream django_v1 {
    server web_django:8000;
}

upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log strangler;

    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA VIEJA: Sigue yendo a Django
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RUTA NUEVA: Estrangulamos la funcion de compra y la mandamos a Flask
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Todo lo que aun no se ha migrado (HTML, admin, estaticos) sigue en el monolito
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
